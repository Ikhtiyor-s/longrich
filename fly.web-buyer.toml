# fly.toml for apps/web-buyer (Next.js). Deploy with:
# fly deploy -c fly.web-buyer.toml --app longrich-web

app = 'longrich-web'
primary_region = 'fra'

[build]
  dockerfile = 'infra/docker/web-buyer.Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
