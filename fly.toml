# fly.toml app configuration file generated for longrich-api on 2026-10-19T20:59:48+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'longrich-api'
primary_region = 'fra'

[build]
  dockerfile = 'infra/docker/api.Dockerfile'

[env]
  PORT = '3000'

[deploy]
  release_command = 'pnpm db:migrate:deploy'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
